<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Assets — Lelemuku.com</title>
<link rel="icon" href="/img/logo.png" type="image/png">
<style>
  :root{
    --bg:#fafafc;
    --card:#ffffff;
    --text:#161617;
    --muted:#767676;
    --link:#005af0;
    --border:#ebeced;
    --shadow:0 10px 20px 0 rgba(30,30,30,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1e1e1e;
      --card:#2d2d30;
      --text:#fefefe;
      --muted:#989b9f;
      --border:rgba(255,255,255,.1);
      --shadow:0 10px 20px 0 rgba(0,0,0,.3);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Nunito Sans',sans-serif;
    font-size:15px;
    line-height:1.6;
    color:var(--text);
    background:var(--bg);
    padding:24px;
  }
  .wrap{
    width:100%;
    max-width:520px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:36px 32px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .logo{
    display:inline-block;
    max-width:140px;
    max-height:36px;
    margin:0 auto 20px;
  }
  h1{
    margin:0 0 6px;
    font-size:22px;
    font-weight:700;
    letter-spacing:-.2px;
  }
  .sub{
    margin:0 0 28px;
    font-size:13px;
    color:var(--muted);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    text-align:left;
    margin:0 0 24px;
    padding:0;
    list-style:none;
  }
  .grid a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    text-decoration:none;
    font-size:13px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .grid a:hover{
    border-color:var(--link);
    color:var(--link);
    transform:translateY(-1px);
  }
  .grid a svg{
    flex-shrink:0;
    width:18px;
    height:18px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
    padding:6px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    margin:0 0 24px;
  }
  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#28a745;
    box-shadow:0 0 0 3px rgba(40,167,69,.15);
  }
  footer{
    margin-top:8px;
    font-size:11px;
    color:var(--muted);
    border-top:1px solid var(--border);
    padding-top:16px;
  }
  footer a{
    color:inherit;
    text-decoration:none;
    border-bottom:1px dotted var(--muted);
  }
  footer a:hover{color:var(--link);border-color:var(--link)}
  @media (max-width:420px){
    .grid{grid-template-columns:1fr}
    .wrap{padding:28px 22px}
    h1{font-size:19px}
  }
</style>
</head>
<body>

<main class="wrap">

  <img class="logo" src="/img/logo.png" alt="Lelemuku.com" onerror="this.style.display='none'">

  <h1>Assets Server</h1>
  <p class="sub">Static files untuk Lelemuku.com</p>

  <div class="status"><span class="dot"></span> Online</div>

  <ul class="grid">
    <li>
      <a href="/css/main.min.css">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
        main.min.css
      </a>
    </li>
    <li>
      <a href="/js/main.min.js">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M9 9l3 3-3 3M14 15h3"/></svg>
        main.min.js
      </a>
    </li>
    <li>
      <a href="/img/">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M3 16l4-4 4 4 3-3 7 7"/></svg>
        /img/
      </a>
    </li>
    <li>
      <a href="/js/">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        /js/
      </a>
    </li>
  </ul>

  <footer>
    &copy; <span id="yr"></span> <a href="https://www.lelemuku.com" target="_blank" rel="noopener">Lelemuku.com</a> &middot; Assets CDN
  </footer>

</main>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
</script>

</body>
</html>
